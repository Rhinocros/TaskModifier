name: Build Windows Executables

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch_name }})
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch_name: x64
          - target: aarch64-pc-windows-msvc
            arch_name: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri App
        run: npx tauri build --target ${{ matrix.target }}

      - name: Locate and prepare executable
        shell: powershell
        run: |
          $target = "${{ matrix.target }}"
          $arch = "${{ matrix.arch_name }}"
          $distDir = "dist"
          
          if (-not (Test-Path $distDir)) {
              New-Item -ItemType Directory -Path $distDir
          }
          
          $candidates = @(
              "src-tauri/target/$target/release/TaskModifier.exe",
              "src-tauri/target/$target/release/task-modifier.exe",
              "src-tauri/target/release/TaskModifier.exe",
              "src-tauri/target/release/task-modifier.exe"
          )
          
          $foundExe = $null
          foreach ($path in $candidates) {
              if (Test-Path $path) {
                  $foundExe = $path
                  break
              }
          }
          
          if (-not $foundExe) {
              $searched = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.exe" | 
                  Where-Object { $_.FullName -notmatch '\\deps\\' -and $_.FullName -notmatch '\\build\\' } | 
                  Select-Object -First 1
              if ($searched) {
                  $foundExe = $searched.FullName
              }
          }
          
          if ($foundExe) {
              Write-Host "Found executable at $foundExe"
              Copy-Item $foundExe -Destination "$distDir/TaskModifier-windows-$arch.exe"
              Write-Host "Successfully copied to $distDir/TaskModifier-windows-$arch.exe"
          } else {
              Write-Host "Listing contents of src-tauri/target for debugging:"
              Get-ChildItem -Path "src-tauri/target" -Recurse | Select-Object FullName
              Write-Error "Could not find built executable for target $target"
              exit 1
          }


      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskModifier-windows-${{ matrix.arch_name }}
          path: dist/TaskModifier-windows-${{ matrix.arch_name }}.exe

      - name: Upload to Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TaskModifier-windows-${{ matrix.arch_name }}.exe
