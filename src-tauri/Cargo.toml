[package]
name = "task-modifier"
version = "1.0.0"
description = "Windows Scheduled Task Modifier"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "task_modifier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "TaskModifier"
path = "src/main.rs"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation"] }
